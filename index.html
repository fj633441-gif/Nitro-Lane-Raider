<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NITRO LANE RIDER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif;color:#fff}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
#road{position:absolute;left:50%;top:0;transform:translateX(-50%);width:88vw;max-width:520px;height:100%;background:#3a3d42;overflow:hidden}
#road:before,#road:after{content:"";position:absolute;top:0;width:6px;height:100%;background:#fff;z-index:2}
#road:before{left:0}#road:after{right:0}
.lane-line{position:absolute;top:-100px;width:8px;height:100%;background:repeating-linear-gradient(#fff 0 90px,transparent 90px 180px);z-index:1}
#l1{left:33.3%}#l2{left:66.6%}
.car{position:absolute;width:20%;height:110px;border-radius:14px 14px 6px 6px;z-index:5;box-shadow:0 10px 20px rgba(0,0,0,.5)}
.car:before{content:"";position:absolute;top:14px;left:8%;right:8%;height:26px;background:#111;border-radius:8px}
.car:after{content:"";position:absolute;bottom:10px;left:10px;right:10px;height:8px;background:rgba(255,0,0,.8);border-radius:4px}
.red{background:#e11d2e}.white{background:#f1f1f1}.white:before{background:#111}
#bike{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:23%;height:150px;z-index:10;transition:left .12s}
#bike-body{position:absolute;left:50%;top:0;transform:translateX(-50%);width:68px;height:140px;background:#111;border-radius:30px 30px 12px 12px;border:4px solid #facc15}
#bike-tire{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:34px;height:70px;background:#000;border-radius:16px;border:3px solid #333}
#rider{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:52px;height:70px;background:#111;border-radius:22px;border:3px solid #facc15;text-align:center;color:#facc15;font-size:22px;padding-top:8px}
#hud{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:20;font-weight:900;font-size:18px;text-shadow:0 2px 0 #000}
#scoreBox{background:#facc15;color:#000;padding:6px 12px;border-radius:20px}
#speedBox{background:#000;padding:6px 12px;border-radius:20px;border:2px solid #facc15}
#controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:20}
button{width:72px;height:72px;border-radius:50%;border:3px solid #fff;background:#111;color:#fff;font-size:30px}
button:active{background:#facc15;color:#000}
#startScreen{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#startScreen h1{font-size:34px;color:#facc15;line-height:1;margin-bottom:6px}
#startScreen p{opacity:.8;margin-bottom:18px}
#playBtn{width:auto;height:auto;padding:14px 34px;border-radius:30px;background:#facc15;color:#000;font-size:20px;font-weight:900;border:none}
</style>
</head>
<body>
<div id="game">
  <div id="road"><div class="lane-line" id="l1"></div><div class="lane-line" id="l2"></div></div>
  <div id="hud"><div id="scoreBox">SCORE 0</div><div id="speedBox">120 KM/H</div></div>
  <div id="bike"><div id="bike-body"><div id="rider">🏍️</div></div><div id="bike-tire"></div></div>
  <div id="controls"><button onclick="move(-1)">◀</button><button onclick="move(1)">▶</button></div>
  <div id="startScreen"><h1>NITRO<br>LANE RIDER</h1><p>3 Lanes • No Buildings • Just Speed<br>Swipe or tap ◀ ▶ to dodge</p><button id="playBtn" onclick="start()">▶ PLAY</button><p style="margin-top:14px;font-size:13px">Crash = Game Over</p></div>
</div>
<script>
let lane=1, score=0, speed=120, playing=false, cars=[], spawnT=0;
const road=document.getElementById('road'), bike=document.getElementById('bike');
const lanePos=[16.6,50,83.3];
function setBike(){ bike.style.left=lanePos[lane]+'%'; }
function move(d){ if(!playing) return; lane=Math.max(0,Math.min(2,lane+d)); setBike(); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') move(-1); if(e.key==='ArrowRight') move(1); });
let startX=0; document.addEventListener('touchstart',e=>startX=e.touches[0].clientX);
document.addEventListener('touchend',e=>{ let dx=e.changedTouches[0].clientX-startX; if(dx>30) move(1); if(dx<-30) move(-1); });
function start(){ document.getElementById('startScreen').style.display='none'; playing=true; score=0; cars.forEach(c=>c.el.remove()); cars=[]; lane=1; setBike(); requestAnimationFrame(loop); }
function spawn(){ let l=Math.floor(Math.random()*3); let el=document.createElement('div'); el.className='car '+(Math.random()>0.5?'red':'white'); el.style.left=(lanePos[l]-10)+'%'; el.style.top='-130px'; road.appendChild(el); cars.push({el,lane:l,y:-130,spd:6+Math.random()*3}); }
let last=0;
function loop(t){ if(!playing) return; let dt=Math.min(30,t-last||16); last=t; score+=1; speed=120+Math.floor(score/200); document.getElementById('scoreBox').innerText='SCORE '+score; document.getElementById('speedBox').innerText=speed+' KM/H';
spawnT+=dt; if(spawnT>650){ spawnT=0; spawn(); if(Math.random()>0.6) spawn(); }
for(let i=cars.length-1;i>=0;i--){ let c=cars[i]; c.y+=c.spd+speed/45; c.el.style.top=c.y+'px'; if(c.y>window.innerHeight){ c.el.remove(); cars.splice(i,1); continue; }
let bikeRect=bike.getBoundingClientRect(), carRect=c.el.getBoundingClientRect();
if(c.lane===lane && carRect.bottom>bikeRect.top+20 && carRect.top<bikeRect.bottom-20){ gameOver(); return; } }
requestAnimationFrame(loop); }
function gameOver(){ playing=false; alert('CRASH! Your Score: '+score+'\nYou were better than Lovable bro! Tap OK to play again.'); document.getElementById('startScreen').style.display='flex'; document.getElementById('startScreen').querySelector('p').innerText='Score: '+score+' - Tap PLAY to go again'; }
setBike();
</script>
</body>
  </html>
